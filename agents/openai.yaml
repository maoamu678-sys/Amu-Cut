interface:
  display_name: "Amu Cut"
  short_description: "中文口播视频剪辑、字幕、B-roll 与交付验收"
  default_prompt: "使用 Amu Cut Skill：先确认科技商业卡片风或财经人物叙事风，再按人声优先、默认无背景音乐、已批准音效约 -2.3 dBTP、全屏 1–3 秒新语义 B-roll 和陌生人脸规避的共用基线生成内容剪辑方案。用户没有 SRT 时调用本地 Whisper 自动生成字幕，B-roll 按当前口播语义联网检索并保存来源和许可证，按语义和用户要求匹配音效，本地缺少时联网下载，逐条记录来源与落点。用户要求实际视频工程时，使用仓库内 engine/ 生成可编辑的 Three.js、Python 和 FFmpeg 工程，并保留验收预览和交付状态记录。"
